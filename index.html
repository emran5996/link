<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telegram Боты</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
    background: #000;
}

body {
    width: 100%;
    min-height: 100vh;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(
            circle at center,
            #100819 0%,
            #050308 35%,
            #000000 75%
        );

    color: white;
    position: relative;
}

/* Фиолетовое свечение */
.glow {
    position: absolute;
    width: 350px;
    height: 350px;

    border-radius: 50%;

    background: #6415a8;
    filter: blur(160px);
    opacity: .10;

    pointer-events: none;
}

/* Основной блок */
.container {
    position: relative;
    z-index: 2;

    width: 100%;
    padding: 20px;

    text-align: center;
}

h1 {
    font-size: 40px;
    margin-bottom: 15px;

    letter-spacing: 1px;

    text-shadow:
        0 0 15px rgba(135,50,255,.35);
}

.subtitle {
    color: #858585;
    font-size: 16px;

    margin-bottom: 35px;
}

/* Кнопки */
.buttons {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 18px;
}

button {
    position: relative;

    width: 280px;
    padding: 20px 30px;

    color: white;

    background: rgba(15,8,22,.9);

    border: 1.5px solid #7d32c9;
    border-radius: 16px;

    font-size: 19px;
    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(125,50,201,.25),
        inset 0 0 15px rgba(125,50,201,.05);

    transition: .25s;

    animation: pulse 2.5s ease-in-out infinite;

    -webkit-tap-highlight-color: transparent;
}

button:nth-child(2) {
    animation-delay: .5s;
}

button:hover {
    transform: translateY(-3px) scale(1.03);

    background: rgba(35,15,50,.9);

    box-shadow:
        0 0 25px rgba(125,50,201,.55),
        0 0 50px rgba(125,50,201,.18);
}

button:active {
    transform: scale(.97);
}

/* Пульсация */
@keyframes pulse {
    0%,100% {
        box-shadow:
            0 0 12px rgba(125,50,201,.25);
    }

    50% {
        box-shadow:
            0 0 25px rgba(125,50,201,.55),
            0 0 45px rgba(125,50,201,.15);
    }
}

/* Нижний текст */
.tip {
    margin-top: 25px;

    color: #555;
    font-size: 13px;
}

/* ================================= */
/* ИНСТРУКЦИЯ ДЛЯ TELEGRAM */
/* ================================= */

.browser-help {
    display: none;

    position: fixed;

    top: 12px;
    right: 12px;

    z-index: 100;

    width: 245px;

    padding: 16px 18px;

    text-align: left;

    border-radius: 18px;

    background: rgba(13, 8, 18, .94);

    border: 1px solid rgba(145, 68, 230, .7);

    box-shadow:
        0 0 25px rgba(125, 50, 201, .3);

    backdrop-filter: blur(12px);

    animation: helpAppear .7s ease;
}

.browser-help-title {
    color: #fff;

    font-size: 16px;
    font-weight: 700;

    margin-bottom: 7px;
}

.browser-help-text {
    color: #a9a9a9;

    font-size: 13px;
    line-height: 1.5;
}

/* Большая стрелка к ••• */
.help-arrow {
    position: absolute;

    top: -18px;
    right: 12px;

    color: #a45cff;

    font-size: 38px;
    font-weight: bold;

    transform: rotate(-25deg);

    text-shadow:
        0 0 12px rgba(164,92,255,.8);

    animation: arrowMove 1.2s ease-in-out infinite;
}

/* Маленький кружок вокруг подсказки */
.help-dot {
    position: absolute;

    top: -3px;
    right: 2px;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #a45cff;

    box-shadow:
        0 0 12px #a45cff;

    animation: dotPulse 1.2s infinite;
}

@keyframes arrowMove {
    0%,100% {
        transform: rotate(-25deg) translateY(0);
    }

    50% {
        transform: rotate(-25deg) translateY(-5px);
    }
}

@keyframes dotPulse {
    50% {
        transform: scale(1.5);
        opacity: .5;
    }
}

@keyframes helpAppear {
    from {
        opacity: 0;
        transform: translateY(-15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* На телефонах показываем инструкцию */
@media (max-width: 700px) {

    .browser-help {
        display: block;
    }

    h1 {
        font-size: 30px;
    }

    .subtitle {
        font-size: 14px;
    }

    button {
        width: 260px;
        padding: 18px 25px;
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="glow"></div>

<!-- Подсказка -->
<div class="browser-help">

    <div class="help-arrow">↗</div>
    <div class="help-dot"></div>

    <div class="browser-help-title">
        ⚠️ Не открывается бот?
    </div>

    <div class="browser-help-text">
        Нажми на <b>•••</b> в правом верхнем углу
        <br>
        ↓
        <br>
        Выбери <b>«Открыть в браузере»</b>
    </div>

</div>

<div class="container">

    <h1>Добро пожаловать</h1>

    <div class="subtitle">
        Выберите нужного бота
    </div>

    <div class="buttons">

        <button id="demolitionButton">
            ❄️ Бот для сноса
        </button>

        <button id="lookupButton">
            🔍 Бот для пробива
        </button>

    </div>

    <div class="tip">
        Переход в Telegram
    </div>

</div>

<script>

const DEMOLITION_BOT =
"https://t.me/ZeroTraceeBbot?start=ref_eyJhnre1ECbTo6ihrP6ne6g";

const LOOKUP_BOT =
"https://t.me/Astralis5tbot?start=ref_8866728106";

/* Переход в бота */
document
.getElementById("demolitionButton")
.addEventListener("click", function () {
    window.location.href = DEMOLITION_BOT;
});

document
.getElementById("lookupButton")
.addEventListener("click", function () {
    window.location.href = LOOKUP_BOT;
});

/* Восстановление страницы после возврата */
function restorePage() {

    document.documentElement.style.background = "#000";

    document.body.style.background =
        "radial-gradient(circle at center, #100819 0%, #050308 35%, #000000 75%)";

    document.body.style.opacity = "1";
}

window.addEventListener("pageshow", restorePage);

window.addEventListener("focus", restorePage);

document.addEventListener("visibilitychange", function () {

    if (!document.hidden) {
        restorePage();
    }

});

</script>

</body>
</html>
