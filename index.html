<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Переход в бота</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(-45deg,#000000,#12001f,#21003d,#000000);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    position:relative;
}

/* Плавающее свечение */
.blur{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.28;
    animation:float 10s ease-in-out infinite;
}

.blur:nth-child(1){
    background:#8d36ff;
    top:-180px;
    left:-180px;
}

.blur:nth-child(2){
    background:#5b1fff;
    right:-180px;
    bottom:-180px;
    animation-delay:2s;
}

/* Звёзды */
.star{
    position:absolute;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:twinkle linear infinite;
}

.container{
    position:relative;
    z-index:5;
    text-align:center;
}

h1{
    color:white;
    font-size:42px;
    margin-bottom:18px;
    letter-spacing:2px;
    text-shadow:0 0 20px #7b2cff;
}

.subtitle{
    color:#cfcfcf;
    margin-bottom:45px;
    font-size:18px;
}

button{
    position:relative;
    padding:22px 65px;
    font-size:22px;
    color:white;
    background:rgba(255,255,255,.05);
    border:2px solid #8b4dff;
    border-radius:18px;
    cursor:pointer;
    transition:.35s;
    overflow:hidden;
    backdrop-filter:blur(10px);
    box-shadow:
    0 0 18px rgba(136,70,255,.35),
    inset 0 0 12px rgba(255,255,255,.04);

    animation:pulse 2s infinite;
}

button::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:60%;
    height:100%;
    transform:skewX(-25deg);
    background:linear-gradient(to right,transparent,rgba(255,255,255,.45),transparent);
}

button:hover::before{
    animation:shine .9s;
}

button:hover{
    transform:translateY(-4px) scale(1.04);
    box-shadow:
    0 0 35px #8b4dff,
    0 0 70px rgba(139,77,255,.45);
}

button:active{
    transform:scale(.96);
}

.tip{
    margin-top:30px;
    color:#9d9d9d;
    font-size:14px;
    animation:fade 3s infinite;
}

@keyframes shine{
    100%{
        left:180%;
    }
}

@keyframes pulse{
    0%,100%{
        box-shadow:
        0 0 20px rgba(140,70,255,.45);
    }
    50%{
        box-shadow:
        0 0 45px rgba(140,70,255,.95),
        0 0 70px rgba(140,70,255,.4);
    }
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

@keyframes float{
    50%{
        transform:translateY(60px) scale(1.15);
    }
}

@keyframes fade{
    50%{
        opacity:.35;
    }
}

@keyframes twinkle{
    from{
        transform:translateY(0px);
        opacity:.2;
    }
    50%{
        opacity:1;
    }
    to{
        transform:translateY(-40px);
        opacity:.2;
    }
}
</style>

</head>
<body>

<div class="blur"></div>
<div class="blur"></div>

<div class="container">

<h1>Добро пожаловать</h1>

<div class="subtitle">
Нажмите кнопку ниже для перехода в Telegram-бота
</div>

<button id="goButton">
Перейти в бота
</button>

<div class="tip">
⚡ Быстро • Безопасно • В один клик
</div>

</div>

<script>
// =============================
// ВСТАВЬ СЮДА СВОЮ ССЫЛКУ
// =============================
const BOT_LINK = "https://t.me/LunacyBreakerSnosing_bot?start=8123345032";

document.getElementById("goButton").onclick = () => {
    window.location.href = BOT_LINK;
};

// Создание красивых звезд
for(let i=0;i<80;i++){

    const s=document.createElement("div");
    s.className="star";

    const size=Math.random()*3+1;

    s.style.width=size+"px";
    s.style.height=size+"px";

    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";

    s.style.animationDuration=(Math.random()*4+2)+"s";
    s.style.animationDelay=(Math.random()*5)+"s";

    document.body.appendChild(s);
}
</script>

</body>
</html>
