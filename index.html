<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telegram Боты</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
    background: #000000;
}

body {
    width: 100%;
    min-height: 100vh;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(
            circle at center,
            #100819 0%,
            #050308 35%,
            #000000 75%
        );

    position: relative;
}

/* Слабое фиолетовое свечение */
.glow {
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;

    background: #5d16a8;
    filter: blur(160px);
    opacity: 0.10;

    pointer-events: none;
}

.container {
    position: relative;
    z-index: 2;

    width: 100%;
    text-align: center;

    padding: 20px;
}

h1 {
    color: #ffffff;

    font-size: 40px;
    font-weight: 700;

    letter-spacing: 1px;
    margin-bottom: 15px;

    text-shadow:
        0 0 15px rgba(135, 50, 255, 0.35);
}

.subtitle {
    color: #858585;

    font-size: 16px;

    margin-bottom: 35px;
}

.buttons {
    display: flex;
    flex-direction: column;

    align-items: center;

    gap: 18px;
}

button {
    position: relative;

    width: 280px;

    padding: 20px 30px;

    color: #ffffff;

    background: rgba(15, 8, 22, 0.9);

    border: 1.5px solid #7d32c9;
    border-radius: 16px;

    font-size: 19px;
    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(125, 50, 201, 0.25),
        inset 0 0 15px rgba(125, 50, 201, 0.05);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;

    animation: pulse 2.5s ease-in-out infinite;

    -webkit-tap-highlight-color: transparent;
}

button:nth-child(2) {
    animation-delay: 0.5s;
}

/* Блик */
button::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 60%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.18),
        transparent
    );

    transform: skewX(-25deg);

    pointer-events: none;
}

button:hover::before {
    animation: shine 0.8s ease;
}

button:hover {
    transform: translateY(-3px) scale(1.03);

    background: rgba(35, 15, 50, 0.9);

    box-shadow:
        0 0 25px rgba(125, 50, 201, 0.55),
        0 0 50px rgba(125, 50, 201, 0.18);
}

button:active {
    transform: scale(0.97);
}

/* Пульсация */
@keyframes pulse {
    0%, 100% {
        box-shadow:
            0 0 12px rgba(125, 50, 201, 0.25);
    }

    50% {
        box-shadow:
            0 0 25px rgba(125, 50, 201, 0.55),
            0 0 45px rgba(125, 50, 201, 0.15);
    }
}

/* Блик */
@keyframes shine {
    from {
        left: -100%;
    }

    to {
        left: 160%;
    }
}

.tip {
    margin-top: 25px;

    color: #555555;

    font-size: 13px;
}

/* Телефон */
@media (max-width: 600px) {

    h1 {
        font-size: 30px;
    }

    .subtitle {
        font-size: 14px;
    }

    button {
        width: 260px;

        padding: 18px 25px;

        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">

    <h1>Добро пожаловать</h1>

    <div class="subtitle">
        Выберите нужного бота
    </div>

    <div class="buttons">

        <button id="demolitionButton">
            ❄️ Бот для сноса
        </button>

        <button id="lookupButton">
            🔍 Бот для пробива
        </button>

    </div>

    <div class="tip">
        Переход в Telegram
    </div>

</div>

<script>
const DEMOLITION_BOT =
    "https://t.me/ZeroTraceeBbot?start=ref_eyJhnre1ECbTo6ihrP6ne6g";

const LOOKUP_BOT =
    "https://t.me/Astralis5tbot?start=ref_8866728106";

/* Переход в бота */
document
    .getElementById("demolitionButton")
    .addEventListener("click", function () {
        window.location.href = DEMOLITION_BOT;
    });

document
    .getElementById("lookupButton")
    .addEventListener("click", function () {
        window.location.href = LOOKUP_BOT;
    });

/*
   Исправление белого экрана после
   возвращения из Telegram.
*/
function restorePage() {
    document.documentElement.style.background = "#000000";
    document.body.style.background =
        "radial-gradient(circle at center, #100819 0%, #050308 35%, #000000 75%)";

    document.body.style.opacity = "1";
}

/* Когда пользователь возвращается на сайт */
window.addEventListener("pageshow", restorePage);

window.addEventListener("focus", restorePage);

document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
        restorePage();
    }
});
</script>

</body>
</html>
