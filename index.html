<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Переход в бота</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;

    /* Очень тёмный фон */
    background:
        radial-gradient(
            circle at center,
            #100819 0%,
            #050308 35%,
            #000000 75%
        );

    position: relative;
}

/* Очень слабое фиолетовое свечение */
.glow {
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: #5d16a8;
    filter: blur(160px);
    opacity: 0.10;
    pointer-events: none;
}

/* Контент */
.container {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 20px;
}

h1 {
    color: #ffffff;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 15px;

    text-shadow:
        0 0 15px rgba(135, 50, 255, 0.35);
}

.subtitle {
    color: #858585;
    font-size: 16px;
    margin-bottom: 40px;
}

/* Кнопка */
button {
    position: relative;

    padding: 20px 55px;

    color: #ffffff;
    background: rgba(15, 8, 22, 0.8);

    border: 1.5px solid #7d32c9;
    border-radius: 16px;

    font-size: 19px;
    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(125, 50, 201, 0.25),
        inset 0 0 15px rgba(125, 50, 201, 0.05);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;

    animation: pulse 2.5s ease-in-out infinite;
}

/* Светящаяся полоска */
button::before {
    content: "";
    position: absolute;

    top: 0;
    left: -100%;

    width: 60%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.18),
        transparent
    );

    transform: skewX(-25deg);
}

/* Блик при наведении */
button:hover::before {
    animation: shine 0.8s ease;
}

button:hover {
    transform: translateY(-3px) scale(1.03);

    background: rgba(35, 15, 50, 0.8);

    box-shadow:
        0 0 25px rgba(125, 50, 201, 0.55),
        0 0 50px rgba(125, 50, 201, 0.18);
}

button:active {
    transform: scale(0.97);
}

/* Пульсация */
@keyframes pulse {
    0%, 100% {
        box-shadow:
            0 0 12px rgba(125, 50, 201, 0.25);
    }

    50% {
        box-shadow:
            0 0 25px rgba(125, 50, 201, 0.55),
            0 0 45px rgba(125, 50, 201, 0.15);
    }
}

/* Блик */
@keyframes shine {
    from {
        left: -100%;
    }

    to {
        left: 160%;
    }
}

/* Нижний текст */
.tip {
    margin-top: 25px;

    color: #555555;
    font-size: 13px;
}

/* Адаптация для телефона */
@media (max-width: 600px) {

    h1 {
        font-size: 30px;
    }

    .subtitle {
        font-size: 14px;
        margin-bottom: 32px;
    }

    button {
        padding: 18px 38px;
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">

    <h1>Добро пожаловать</h1>

    <div class="subtitle">
        Нажмите кнопку ниже для перехода
    </div>

    <button id="goButton">
        Перейти в бота
    </button>

    <div class="tip">
        Переход в Telegram
    </div>

</div>

<script>
const BOT_LINK =
    "https://t.me/ZeroTraceeBbot?start=ref_eyJhnre1ECbTo6ihrP6ne6g";

document.getElementById("goButton").addEventListener("click", function () {
    window.location.href = BOT_LINK;
});
</script>

</body>
</html>
