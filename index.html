<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Боты</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #000;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #100819 0%,
            #050308 38%,
            #000000 78%
        );
}

/* =========================
   ИНСТРУКЦИЯ
========================= */

.help {
    position: fixed;

    top: 14px;
    right: 14px;

    width: 255px;

    padding: 16px 18px;

    z-index: 9999;

    background: rgba(10, 6, 15, 0.97);

    border: 1px solid rgba(140, 65, 220, 0.8);

    border-radius: 16px;

    box-shadow:
        0 0 25px rgba(125, 50, 201, 0.25);

    font-size: 14px;
    line-height: 1.5;
}

/* Красивая статичная стрелка */
.arrow {
    position: absolute;

    top: -30px;
    right: 17px;

    width: 32px;
    height: 32px;

    color: #a65cff;

    filter:
        drop-shadow(0 0 7px rgba(166, 92, 255, 0.7));

    pointer-events: none;
}

/* Линия стрелки */
.arrow::before {
    content: "";

    position: absolute;

    width: 3px;
    height: 28px;

    background: #a65cff;

    border-radius: 5px;

    right: 9px;
    top: 4px;

    transform: rotate(42deg);
}

/* Наконечник */
.arrow::after {
    content: "";

    position: absolute;

    width: 12px;
    height: 12px;

    border-top: 3px solid #a65cff;
    border-right: 3px solid #a65cff;

    right: 2px;
    top: 0;

    transform: rotate(42deg);
}

.help-title {
    color: #fff;

    font-size: 16px;
    font-weight: 700;

    margin-bottom: 5px;
}

.help-text {
    color: #a9a9a9;
}

.help-text b {
    color: #fff;
}

/* =========================
   ОСНОВНОЙ САЙТ
========================= */

.container {
    text-align: center;
    z-index: 2;
}

h1 {
    font-size: 40px;
    margin-bottom: 15px;

    text-shadow:
        0 0 15px rgba(135, 50, 255, 0.35);
}

.subtitle {
    color: #858585;
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    flex-direction: column;

    align-items: center;

    gap: 18px;
}

button {
    width: 280px;

    padding: 20px 25px;

    color: white;

    background: rgba(15, 8, 22, 0.9);

    border: 1.5px solid #7d32c9;

    border-radius: 16px;

    font-size: 19px;
    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(125, 50, 201, 0.25);

    animation: pulse 2.5s infinite;

    transition: transform 0.25s ease,
                box-shadow 0.25s ease;
}

button:hover {
    transform: scale(1.03);

    box-shadow:
        0 0 25px rgba(125, 50, 201, 0.6),
        0 0 50px rgba(125, 50, 201, 0.2);
}

button:active {
    transform: scale(0.97);
}

@keyframes pulse {
    0%, 100% {
        box-shadow:
            0 0 12px rgba(125, 50, 201, 0.25);
    }

    50% {
        box-shadow:
            0 0 25px rgba(125, 50, 201, 0.55),
            0 0 45px rgba(125, 50, 201, 0.15);
    }
}

.tip {
    margin-top: 25px;

    color: #555;

    font-size: 13px;
}

/* =========================
   МОБИЛЬНАЯ ВЕРСИЯ
========================= */

@media (max-width: 600px) {

    h1 {
        font-size: 30px;
    }

    .subtitle {
        font-size: 14px;
    }

    button {
        width: 260px;

        padding: 18px;

        font-size: 17px;
    }

    .help {
        width: 245px;
        right: 10px;
        top: 10px;
    }
}

/* На компьютере подсказка не нужна */
@media (min-width: 701px) {
    .help {
        display: none;
    }
}
</style>
</head>

<body>

<!-- Инструкция -->
<div class="help">

    <div class="arrow"></div>

    <div class="help-title">
        ⚠️ Не открывается?
    </div>

    <div class="help-text">
        Нажми на <b>•••</b> сверху
        <br>
        ↓
        <br>
        Выбери <b>«Открыть в браузере»</b>
    </div>

</div>

<!-- Основной контент -->
<div class="container">

    <h1>Добро пожаловать</h1>

    <div class="subtitle">
        Выберите нужного бота
    </div>

    <div class="buttons">

        <button onclick="openBot('https://t.me/ZeroTraceeBbot?start=ref_eyJhnre1ECbTo6ihrP6ne6g')">
            ❄️ Бот для сноса
        </button>

        <button onclick="openBot('https://t.me/Astralis5tbot?start=ref_8123345032')">
            🔍 Бот для пробива
        </button>

    </div>

    <div class="tip">
        Переход в Telegram
    </div>

</div>

<script>
function openBot(link) {
    window.location.href = link;
}
</script>

</body>
</html>
